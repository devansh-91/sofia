<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16131c">
<title>Sofia</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: dark;
    --bg: #100e14; --panel: #16131c; --line: #262130; --field: #1f1b27;
    --mine: linear-gradient(135deg, #7c4dff, #b04ad9); --hers: #221e2b;
    --accent: #8b5cff; --text: #f2eff7; --dim: #9a93a8; --ok: #3ecf8e; --bad: #e5484d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; background: var(--panel); border-inline: 1px solid var(--line); }

  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); border-bottom: 1px solid var(--line); }
  header img { width: 42px; height: 42px; border-radius: 12px; }
  .who { flex: 1; min-width: 0; }
  .who h1 { font-size: 17px; margin: 0; }
  #status { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  #status.online::before { background: var(--ok); }
  #status.offline::before { background: var(--bad); }
  .toggle { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .toggle input { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; margin: 0; cursor: pointer; transition: background .2s; }
  .toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .toggle input:checked { background: var(--accent); }
  .toggle input:checked::after { transform: translateX(14px); }

  #log { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
  .welcome { margin: auto; text-align: center; color: var(--dim); max-width: 340px; }
  .welcome img { width: 84px; height: 84px; border-radius: 24px; margin-bottom: 12px; }
  .welcome h2 { color: var(--text); margin: 0 0 6px; font-size: 22px; }
  .welcome p { margin: 0 0 4px; }
  .msg { max-width: 78%; padding: 9px 14px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; animation: pop .18s ease-out; }
  .me { align-self: flex-end; background: var(--mine); border-bottom-right-radius: 5px; }
  .her { align-self: flex-start; background: var(--hers); border-bottom-left-radius: 5px; }
  .me + .her, .her + .me { margin-top: 8px; }
  .note { align-self: center; color: var(--dim); font-size: 13px; text-align: center; white-space: pre-wrap; padding: 2px 10px; }
  .learned { align-self: flex-start; font-size: 12.5px; color: #c9b8ff; background: #2a2140; border-radius: 10px; padding: 3px 10px; }
  .typing { display: flex; gap: 4px; padding: 13px 16px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }

  form { display: flex; align-items: center; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; min-width: 0; padding: 12px 16px; border-radius: 24px; border: 1px solid var(--line); background: var(--field); color: var(--text); font-size: 16px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  .round { flex: none; width: 46px; height: 46px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: #fff; background: var(--accent); transition: transform .1s, opacity .2s; }
  .round:active { transform: scale(.94); }
  .round:disabled { opacity: .45; cursor: default; }
  .round svg { width: 22px; height: 22px; }
  #mic { background: var(--field); border: 1px solid var(--line); color: var(--text); }
  #mic.recording { background: var(--bad); border-color: var(--bad); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 #e5484d88; } 100% { box-shadow: 0 0 0 12px #e5484d00; } }
  #callButton { width: 40px; height: 40px; background: var(--ok); }
  #callButton svg { width: 20px; height: 20px; }

  /* Call mode: hands-free, voice to voice. */
  .call { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px;
          padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
          background: radial-gradient(circle at 50% 30%, #2a1f45 0%, var(--bg) 70%); text-align: center; }
  .call-top { width: 100%; max-width: 520px; display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; gap: 12px; }
  #callMic { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .orb { --level: 0; position: relative; width: 150px; height: 150px; margin-top: 7vh; border-radius: 50%; display: grid; place-items: center; }
  .orb::before, .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--accent); opacity: .18; transition: transform .08s linear; }
  .orb::before { transform: scale(calc(1 + var(--level) * .45)); }
  .orb::after { transform: scale(calc(1 + var(--level) * .9)); opacity: .08; }
  .orb img { position: relative; width: 120px; height: 120px; border-radius: 34px; }
  .call[data-state=speaking] .orb::before { animation: speak 1.1s ease-in-out infinite; }
  .call[data-state=speaking] .orb::after { animation: speak 1.1s ease-in-out .25s infinite; }
  .call[data-state=thinking] .orb img { animation: think 1.4s ease-in-out infinite; }
  @keyframes speak { 50% { transform: scale(1.28); } }
  @keyframes think { 50% { opacity: .55; } }
  .call h2 { margin: 18px 0 0; font-size: 26px; }
  #callState { color: var(--dim); min-height: 1.4em; }
  .captions { width: 100%; max-width: 520px; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }
  .caption { color: var(--dim); font-size: 15px; }
  .caption.her { color: var(--text); font-size: 17px; }
  .meter { width: 140px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  #meter { display: block; height: 100%; width: 0; background: var(--ok); transition: width .08s linear; }
  .hint { max-width: 420px; font-size: 13px; color: #ffcf8a; background: #3a2a14; border-radius: 10px; padding: 8px 12px; }
  .call-buttons { display: flex; gap: 36px; margin-top: 8px; }
  .call-buttons .round { width: 64px; height: 64px; }
  .call-buttons .round svg { width: 28px; height: 28px; }
  #callMute { background: var(--field); border: 1px solid var(--line); }
  #callMute.muted { background: #fff; color: var(--bg); }
  #callEnd { background: var(--bad); }
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="/icon.svg" alt="">
    <div class="who">
      <h1>Sofia</h1>
      <div id="status">connecting…</div>
    </div>
    <label class="toggle" id="speakLabel" hidden>voice <input type="checkbox" id="speak" checked></label>
    <button type="button" class="round" id="callButton" hidden aria-label="Call Sofia" title="Call Sofia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
    </button>
  </header>
  <div id="log">
    <div class="welcome" id="welcome">
      <img src="/icon.svg" alt="">
      <h2>Hi, I'm Sofia.</h2>
      <p>Write or talk in English or Hinglish — she answers in English.</p>
      <p id="micHint" hidden>Tap the mic to talk, tap again to send — or tap the green phone for a hands-free call.</p>
      <p style="font-size:13px;margin-top:12px">Commands: /good · /say &lt;better reply&gt; · /memory · /forget &lt;number&gt;</p>
    </div>
  </div>
  <form id="form">
    <button type="button" class="round" id="mic" hidden aria-label="Talk" title="Talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input type="text" id="text" placeholder="Message Sofia…" autocomplete="off" autofocus>
    <button type="submit" class="round" id="send" aria-label="Send" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</div>
<div class="call" id="call" data-state="" hidden>
  <div class="call-top"><span id="callTimer">00:00</span><span id="callMic"></span></div>
  <div class="orb" id="orb"><img src="/icon.svg" alt=""></div>
  <h2>Sofia</h2>
  <div id="callState">connecting…</div>
  <div class="meter" title="your mic level"><span id="meter"></span></div>
  <div class="captions"><div class="caption" id="callHeard"></div><div class="caption her" id="callSaid"></div></div>
  <div class="hint" id="callHint" hidden></div>
  <div class="call-buttons">
    <button type="button" class="round" id="callMute" aria-label="Mute" title="Mute">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button type="button" class="round" id="callEnd" aria-label="End call" title="End call">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9M22 2 2 22"/></svg>
    </button>
  </div>
</div>
<script>
const log = document.getElementById("log"), form = document.getElementById("form"), input = document.getElementById("text");
const mic = document.getElementById("mic"), send = document.getElementById("send"), speak = document.getElementById("speak");
const status = document.getElementById("status");

// The key arrives in the link once, then lives in this browser only.
const fromLink = new URLSearchParams(location.search).get("key");
if (fromLink) { localStorage.setItem("sofiaKey", fromLink); history.replaceState(null, "", "/"); }
const key = localStorage.getItem("sofiaKey") || "";

function setStatus(text, kind = "online") {
  status.textContent = text;
  status.className = kind;
}

function add(kind, text) {
  document.getElementById("welcome")?.remove();
  const bubble = document.createElement("div");
  bubble.className = ["note", "learned"].includes(kind) ? kind : "msg " + kind;
  bubble.textContent = text;
  log.appendChild(bubble);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

function typing() {
  const bubble = add("her", "");
  bubble.classList.add("typing");
  bubble.innerHTML = "<span></span><span></span><span></span>";
  return bubble;
}

async function call(path, options = {}) {
  const response = await fetch(path, { ...options, headers: { ...(options.headers || {}), "X-Sofia-Key": key } });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

async function show(data) {
  if (data.command !== undefined) return add("note", data.command);
  if (data.error) return add("note", data.error);
  add("her", data.answer);
  for (const item of data.looked || []) add("learned", "dekha: " + item);
  for (const item of data.learned || []) add("learned", "yaad rakha: " + item);
  if (data.audio?.length && speak.checked) playPieces(data.audio);
}

// Her reply arrives as spoken pieces, rendered one after another: each plays as soon as it is
// ready, while the next is fetched. stopSpeaking() cuts her off.
let playing = null;

function fetchPiece(name) {
  return fetch("/audio/" + name, { headers: { "X-Sofia-Key": key } })
    .then((response) => (response.ok ? response.blob() : null)).catch(() => null);
}

async function playPieces(names) {
  stopSpeaking();
  const run = { stopped: false };
  playing = run;
  let next = fetchPiece(names[0]);
  for (let i = 0; i < names.length && !run.stopped; i++) {
    const blob = await next;
    next = i + 1 < names.length ? fetchPiece(names[i + 1]) : null;
    if (!blob || run.stopped) continue;
    const url = URL.createObjectURL(blob);
    run.audio = new Audio(url);
    await new Promise((resolve) => {
      run.done = resolve;
      run.audio.onended = run.audio.onerror = resolve;
      run.audio.play().catch(resolve);
    });
    URL.revokeObjectURL(url);
  }
  if (playing === run) playing = null;
}

function stopSpeaking() {
  if (!playing) return;
  playing.stopped = true;
  playing.audio?.pause();
  playing.done?.();
  playing = null;
}

async function busy(work, doing = "typing…") {
  send.disabled = mic.disabled = true;
  setStatus(doing);
  const dots = typing();
  try {
    await work(dots);
    setStatus("online");
  } catch (error) {
    add("note", "Problem: " + error.message);
    setStatus("online");
  }
  dots.remove();
  send.disabled = mic.disabled = false;
  input.focus();
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  add("me", text);
  busy(async () => show(await call("/api/chat", { method: "POST", body: JSON.stringify({ text }) })));
});

// Tap the mic to start, tap again to send.
let recorder = null;
mic.addEventListener("click", async () => {
  if (recorder) { recorder.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (error) { return add("note", "Microphone blocked: " + error.message); }
  const chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (event) => chunks.push(event.data);
  recorder.onstop = () => {
    stream.getTracks().forEach((track) => track.stop());
    mic.classList.remove("recording");
    const blob = new Blob(chunks, { type: recorder.mimeType });
    recorder = null;
    busy(async (dots) => {
      const data = await call("/api/voice", { method: "POST", body: blob });
      if (!data.heard) return add("note", "Didn't catch that.");
      // Her typing dots go after what she heard.
      log.insertBefore(add("me", data.heard + (data.sounds && data.sounds !== "neutral" ? "  (" + data.sounds + ")" : "")), dots);
      await show(data);
    }, "listening…");
  };
  recorder.start();
  mic.classList.add("recording");
  setStatus("recording — tap the mic again to send");
});

// Call mode: hands-free. She listens, notices when you stop talking, answers out loud, and
// listens again. Talk over her and she stops. Everything said also lands in the chat.
const callBox = document.getElementById("call"), callState = document.getElementById("callState");
const callHint = document.getElementById("callHint"), callMute = document.getElementById("callMute");
const TICK = 50;           // ms between mic level checks
const START_AFTER = 150;   // ms of voice before it counts as you talking
const END_AFTER = 900;     // ms of quiet that ends what you said
const LONGEST = 30000;     // ms: send it anyway after this long
const BARGE_AFTER = 300;   // ms of you talking over her before she stops
const SILENT_MIC = 0.0003; // a level this low for the whole first seconds means the mic is muted or wrong
let calling = null;

const STATES = { listening: "listening…", hearing: "hearing you…", thinking: "thinking…", speaking: "speaking — talk to interrupt", muted: "muted" };

function setCallState(state) {
  calling.state = state;
  callBox.dataset.state = state;
  callState.textContent = STATES[state];
}

function level() {
  calling.analyser.getFloatTimeDomainData(calling.samples);
  let sum = 0;
  for (const sample of calling.samples) sum += sample * sample;
  return Math.sqrt(sum / calling.samples.length);
}

// A fresh recording for each thing you say; `discard` drops one that only caught silence.
function listen() {
  if (!calling) return;
  calling.recorder?.stop();
  const chunks = [], recorder = new MediaRecorder(calling.stream);
  recorder.ondataavailable = (event) => chunks.push(event.data);
  recorder.onstop = () => { if (!recorder.discard) sendSpeech(new Blob(chunks, { type: recorder.mimeType })); };
  recorder.discard = true;
  recorder.start();
  Object.assign(calling, { recorder, began: Date.now(), voiced: 0, quiet: 0, barge: 0 });
  setCallState(calling.muted ? "muted" : "listening");
}

function finishSpeech() {
  setCallState("thinking");
  calling.recorder.discard = false;
  calling.recorder.stop();
  calling.recorder = null;
}

async function sendSpeech(blob) {
  const call_ = calling;
  try {
    const data = await call("/api/voice", { method: "POST", body: blob });
    if (calling !== call_) return;
    if (!data.heard) return listen();
    document.getElementById("callHeard").textContent = "You: " + data.heard;
    document.getElementById("callSaid").textContent = data.answer || data.command || data.error || "";
    add("me", data.heard + (data.sounds && data.sounds !== "neutral" ? "  (" + data.sounds + ")" : ""));
    const audio = data.audio;
    await show({ ...data, audio: null });
    if (calling !== call_) return;
    if (audio?.length) {
      setCallState("speaking");
      calling.echo = 0;
      await playPieces(audio);
    }
    if (calling === call_ && calling.state === "speaking") listen();
  } catch (error) {
    if (calling !== call_) return;
    add("note", "Problem: " + error.message);
    listen();
  }
}

function tick() {
  const now = Date.now(), loud = calling.muted ? 0 : level();
  document.getElementById("meter").style.width = Math.min(100, loud * 900) + "%";
  document.getElementById("orb").style.setProperty("--level", calling.state === "hearing" ? Math.min(1, loud * 12) : 0);
  calling.peak = Math.max(calling.peak, loud);
  if (!calling.muted && now - calling.started > 6000 && calling.peak < SILENT_MIC && callHint.hidden) {
    callHint.hidden = false;
    callHint.textContent = `No sound is coming from "${calling.mic}". It may be muted: unmute it in the system's sound settings, or run  wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 0`;
  }
  if (calling.peak >= SILENT_MIC) callHint.hidden = true;

  const threshold = Math.max(calling.floor * 2.5, 0.012);
  if (calling.state === "listening" || calling.state === "hearing") {
    if (loud > threshold) {
      calling.voiced += TICK;
      calling.quiet = 0;
      if (calling.state === "listening" && calling.voiced >= START_AFTER) setCallState("hearing");
    } else {
      calling.quiet += TICK;
      if (calling.state === "listening") {
        calling.voiced = Math.max(0, calling.voiced - TICK);
        calling.floor = calling.floor * 0.97 + loud * 0.03;  // the room's own noise
      }
    }
    if (calling.state === "hearing" && (calling.quiet >= END_AFTER || now - calling.began > LONGEST)) finishSpeech();
    else if (calling.state === "listening" && now - calling.began > 20000) listen();  // keep recordings short
  } else if (calling.state === "speaking") {
    // What leaks from her own voice into the mic stays low and steady; you starting to talk is
    // sudden. The gaps between your words only slow the count down: echo cancellation also
    // turns you down while she talks.
    const loudEnough = loud > Math.max(0.035, calling.floor * 4, calling.echo * 2.5);
    if (!calling.barge) calling.echo = calling.echo * 0.95 + loud * 0.05;
    calling.barge = loudEnough ? calling.barge + TICK : Math.max(0, calling.barge - TICK / 2);
    if (calling.barge >= BARGE_AFTER) {
      stopSpeaking();
      call("/api/hush", { method: "POST", body: "{}" }).catch(() => {});
      listen();
      calling.voiced = START_AFTER;
      setCallState("hearing");
    }
  }
}

async function startCall() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (error) {
    return add("note", "Microphone blocked: " + error.message);
  }
  stopSpeaking();
  const context = new AudioContext(), analyser = context.createAnalyser();
  analyser.fftSize = 1024;
  context.createMediaStreamSource(stream).connect(analyser);
  const mic = stream.getAudioTracks()[0].label || "microphone";
  calling = { stream, context, analyser, samples: new Float32Array(analyser.fftSize), mic, muted: false,
              floor: 0.005, peak: 0, echo: 0, started: Date.now() };
  calling.timer = setInterval(() => {
    const seconds = Math.floor((Date.now() - calling.started) / 1000);
    document.getElementById("callTimer").textContent = String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0");
  }, 1000);
  calling.ticker = setInterval(tick, TICK);
  document.getElementById("callMic").textContent = "mic: " + mic;
  document.getElementById("callHeard").textContent = document.getElementById("callSaid").textContent = "";
  callHint.hidden = true;
  callMute.classList.remove("muted");
  callBox.hidden = false;
  add("note", "call started");
  listen();
}

function endCall() {
  if (!calling) return;
  const ended = calling;
  calling = null;
  clearInterval(ended.ticker);
  clearInterval(ended.timer);
  if (ended.recorder) { ended.recorder.discard = true; ended.recorder.stop(); }
  stopSpeaking();
  ended.stream.getTracks().forEach((track) => track.stop());
  ended.context.close();
  callBox.hidden = true;
  add("note", "call ended · " + document.getElementById("callTimer").textContent);
  input.focus();
}

document.getElementById("callButton").addEventListener("click", startCall);
document.getElementById("callEnd").addEventListener("click", endCall);
callMute.addEventListener("click", () => {
  calling.muted = !calling.muted;
  calling.stream.getAudioTracks().forEach((track) => (track.enabled = !calling.muted));
  callMute.classList.toggle("muted", calling.muted);
  if (calling.state === "listening" || calling.state === "hearing" || calling.state === "muted") listen();
});
document.addEventListener("keydown", (event) => { if (event.key === "Escape") endCall(); });

(async () => {
  if (!key) {
    setStatus("no access key", "offline");
    return add("note", "Open the link printed by ./scripts/sofia.sh serve — it carries your access key.");
  }
  try {
    const status = await call("/api/status");
    document.getElementById("speakLabel").hidden = !status.speech;
    // Browsers only hand out the microphone on https or localhost.
    mic.hidden = !(status.speech && navigator.mediaDevices && window.MediaRecorder);
    document.getElementById("micHint").hidden = mic.hidden;
    document.getElementById("callButton").hidden = mic.hidden;
    setStatus("online");
  } catch (error) {
    setStatus("offline", "offline");
    return add("note", "Can't reach Sofia: " + error.message);
  }
  // She says hello first (nothing when you were here a moment ago).
  busy(async () => {
    const hello = await call("/api/hello", { method: "POST", body: "{}" });
    if (hello.answer) await show(hello);
  });
})();
</script>
</body>
</html>
